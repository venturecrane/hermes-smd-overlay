name: hermes-smd-initiation
version: "0.2.0"
description: "Authored initiation authority for person-invoked skills over the mail channel (ss#2222 gate 3, from the card-rehearsal R1 finding): a pre_llm_call injection that resolves the turn's attributed sender against the LIVE authored roster (scope.inbound_allow_from) and admin list (scope.admins) and states the disposition to the model — an authenticated rostered sender's direct ask IS person-initiation for manual-initiation skills; admin-reserved skills additionally require the sender to be admin-classed (polite decline otherwise); forwarded/quoted/attached content stays third-party data and never initiates anything; a skill's work is never approximated without running it. The disposition is authored + platform-resolved, never model-judged per turn — R1 observed three different dispositions (answer / improvise / refuse) for skill-shaped requests on the same channel. Fail-safe: an unattributed turn, a non-rostered sender, or an unreadable config injects nothing (the ADR 0027 fence + taint already govern non-rostered inbound). ALSO registers the READ tool operator_seat_facts (ss#2222 card rows 1+7): grounded identity, declared connections, the routine roster paired against the live scheduler store, three-state installed-voice status, cohort discrepancies, and the counts line — assembled in-process so an introduce ask on the mail channel is answered from what was read rather than from memory. The skill body is unreachable on that channel (core pre-loads only the routed skill, and the router's skill_view instruction names a tool the webhook surface does not offer), which is how a fluent roster of the wrong seat shipped in front of a client. Run-history fields are dropped at the read boundary, matter and client names are unreachable by construction, every section is fail-open with an unreadable[] entry, and a one-line pre_llm_call nudge rides rostered webhook turns whose message reads as an ask about the seat. No requires_env and no check_fn on the tool: a failing check drops a tool from the resolved surface silently, which is the failure class this closes."
author: VentureCrane
requires_env: []
provides_hooks:
  - pre_llm_call
hooks:
  - pre_llm_call
