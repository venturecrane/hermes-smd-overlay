name: hermes-smd-audit
version: "0.3.0"
description: "Per-tool, per-LLM-call, and per-subagent audit emission to per-customer D1. SMD compliance + observability. ADR 0022 Stream 2: also persists agent-authored skill bodies to per-customer R2 with a write-ahead pattern + boot-time reconciler."
author: VentureCrane
requires_env:
  - SMD_CUSTOMER_SLUG
  - SMD_D1_AUDIT_BINDING
# ADR 0022 Stream 2 — optional env. Body capture no-ops cleanly when
# any of these are unset (D1 row stays in 'pending'; reconciler retries
# on next boot when env appears).
optional_env:
  - R2_ENDPOINT_URL
  - R2_SKILL_BODIES_BUCKET
  - R2_SKILL_BODIES_ACCESS_KEY_ID
  - R2_SKILL_BODIES_SECRET_ACCESS_KEY
provides_hooks:
  - post_tool_call
  - post_llm_call
  - subagent_stop
hooks:
  - post_tool_call
  - post_llm_call
  - subagent_stop
