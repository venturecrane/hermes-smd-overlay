name: hermes-smd-couples-onboarding
version: "0.1.0"
description: "Couples onboarding (ss-console ADR 0090/0091 R4), space-mode seats only: a Telegram DM from a sender who is not an authored person is dropped before any turn; a `/start <token>` from one is spooled for the gate to redeem at ss-console (shared/telegram_bind.py) and answered with one fixed line. Admits no one: the allowlist changes only through the reviewed customer.yaml. At boot, seeds the couples-checkin records from the onboarding answers both partners confirmed (shared/couples_seed.py)."
author: VentureCrane
requires_env: []
optional_env:
  - SMD_TELEGRAM_BIND_SPOOL_PATH
# No hooks list, like hermes-smd-calendar: pre_gateway_dispatch is wired only on
# a seat that authors people: (space mode), so a static declaration would be
# false on every other seat (tests/test_hook_parity.py).
