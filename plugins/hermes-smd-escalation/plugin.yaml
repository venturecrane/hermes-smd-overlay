name: hermes-smd-escalation
version: "0.1.0"
description: "Escalation-ledger tools (WP-A/#1894 follow-on, ss #1915): escalation_append writes one validated event through the broker's uid-gated escalation_event_append verb; escalation_state folds the read-only ledger twin into per-item state + ACK tokens. escalation_reply_ack resolves a rostered person's plain-word reply to a numbered deadline digest ('got it on 1') to the digest's raise rows by thread and number, in code, and writes the acked rows (no model arguments). The case-manager tools (casework.py) carry the task review (casework_finish), the date-prep brief (casework_brief), a date-prep step the turn ran at handles (casework_step_done, backed by that step's own create_memo call) and every plain-word reply (reply_verdicts, which falls through to escalation_reply_ack when the thread holds no casework rows); task writes they queue replay through the trust gate (shared/casework_acts.py), never the model's arguments. Closes the execute_code dependency the ledger-append procedure shipped with — skills append events without any code_execution exposure. Registers tools only; wires no gateway hooks."
requires_env:
  - SMD_WORKSPACE_BROKER_SOCKET
