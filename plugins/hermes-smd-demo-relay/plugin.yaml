name: hermes-smd-demo-relay
version: "0.1.0"
description: "Demo-only autonomous reply relay: sends the agent's GOVERNED draft back to the verified inbound sender, fail-closed on demo.reply_relay, recipient-locked, re-checking the content + fabrication floors. Defeats no agent floor (design: docs/security/demo-reply-relay-design.md)."
author: VentureCrane
requires_env:
  # Read at register time; the relay is fail-closed without them. AGENTMAIL_API_KEY
  # is the REST send credential (Bearer). SMD_CUSTOMER_SLUG / SMD_D1_AUDIT_BINDING
  # carry the demo-relay audit rows (observability — relay still sends without them).
  - AGENTMAIL_API_KEY
  - SMD_CUSTOMER_SLUG
  - SMD_D1_AUDIT_BINDING
provides_hooks:
  - post_tool_call
hooks:
  - post_tool_call
