name: hermes-smd-medchron
version: "0.1.0"
description: "Chronology-package tools (routine 11, ss-console#2614): agent-facing medchron_job_submit / medchron_job_status / medchron_allowance over the capability broker's medchron_* verbs. The runner itself is a root daemon the agent cannot reach; these three are the whole of its surface. Also the demand job's three (demand_job_submit / demand_job_status / demand_allowance over the broker's demand_* verbs; the requester and the request are taken from the turn's verified inbound email, never from the model). Also the drafting job's three (drafting_job_submit / drafting_job_status / drafting_allowance over the broker's drafting_* verbs, the same origin rule). Registers tools only; wires no gateway hooks."
requires_env:
  - SMD_WORKSPACE_BROKER_SOCKET
