name: hermes-smd-reply
version: "1.0.0"
description: "Operator reply channel: sends the agent's GOVERNED draft back to the verified inbound sender when that sender is on the organization roster (scope.inbound_allow_from), recipient-locked, re-checking the content + fabrication floors. Defeats no agent floor (ADR 0055)."
author: VentureCrane
requires_env:
  # ss#2258: AGENTMAIL_API_KEY is NO LONGER declared here. The AgentMail reply
  # is a broker verb, so this plugin holds no credential that can transmit — the
  # broker socket is the dependency instead. SMD_CUSTOMER_SLUG /
  # SMD_D1_AUDIT_BINDING carry the reply-channel audit rows (observability; the
  # relay still sends without them, and the broker writes the transmit row).
  - SMD_WORKSPACE_BROKER_SOCKET
  - SMD_CUSTOMER_SLUG
  - SMD_D1_AUDIT_BINDING
provides_hooks:
  - post_tool_call
  # ss-console#2367: a held reply is reported to the agent on the draft tool's
  # own result, in the same turn. post_tool_call returns are ignored by the
  # firing site, so the hold was invisible to the model until this attachment.
  - transform_tool_result
hooks:
  - post_tool_call
  - transform_tool_result
