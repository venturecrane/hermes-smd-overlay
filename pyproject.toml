[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-smd-overlay"
version = "0.1.0"
description = "Plugin overlay for the Nous Hermes Agent — adds audit, trust ceilings, voice transformation, and memory mirroring without modifying Hermes core."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "VentureCrane", email = "smdurgan@venturecrane.com" },
]
keywords = ["hermes", "ai-agent", "plugin", "nous-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/venturecrane/hermes-smd-overlay"
Issues = "https://github.com/venturecrane/hermes-smd-overlay/issues"

[project.scripts]
hermes-smd = "bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plugins*", "shared*", "bootstrap*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
