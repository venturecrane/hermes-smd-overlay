[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-smd-overlay"
version = "0.4.0"
description = "Plugin overlay for the Nous Hermes Agent — adds audit, trust ceilings, voice transformation, and memory mirroring without modifying Hermes core."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "VentureCrane", email = "smdurgan@venturecrane.com" },
]
keywords = ["hermes", "ai-agent", "plugin", "nous-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    # ADR 0022 Stream 2 — S3-compatible R2 PUT for agent-authored skill
    # bodies. boto3 is already on the customer Machine (used by awscli in
    # bootstrap.sh); declared here so the plugin import path works in
    # dev environments and the wheel resolves cleanly.
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "setuptools>=68",
    # botocore.exceptions imports exercised by the skill_capture tests.
    # boto3 already lands botocore as a transitive dep; pinned here so
    # the dev extra is self-contained.
    "botocore>=1.34",
]

[project.urls]
Homepage = "https://github.com/venturecrane/hermes-smd-overlay"
Issues = "https://github.com/venturecrane/hermes-smd-overlay/issues"

[project.scripts]
hermes-smd = "bootstrap.cli:main"
hermes-smd-webhook-gate = "webhook_gate:main"

[tool.setuptools]
py-modules = ["webhook_gate"]

[tool.setuptools.packages.find]
where = ["."]
include = ["plugins*", "shared*", "bootstrap*"]

[tool.setuptools.package-data]
shared = ["fabrication_markers.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 line-too-long: handled by formatter at 100 cols; long URL/citation strings exist.
# UP042 enum.StrEnum: codebase uses `(str, enum.Enum)` mixin pattern intentionally;
#   StrEnum changes __str__ semantics (returns value vs Name.MEMBER) which would
#   silently break audit-row serialization and log-string assumptions. Migration
#   would be a separate intentional refactor with explicit test coverage.
# UP017 datetime.UTC: codebase uses `timezone.utc` consistently across audit
#   timestamps and test fixtures; mass-rewrite to the 3.11+ alias is style churn.
ignore = ["E501", "UP042", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
