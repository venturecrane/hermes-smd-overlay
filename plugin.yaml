name: hermes-smd-overlay
version: "0.4.0"
description: "Plugin overlay for the Nous Hermes Agent — adds audit emission, trust ceilings, sample-driven voice transformation, and memory mirroring without modifying Hermes core."
author: VentureCrane
plugins:
  - plugins/hermes-smd-audit
  - plugins/hermes-smd-trust
  - plugins/hermes-smd-voice
  - plugins/hermes-smd-memory-mirror
  - plugins/hermes-smd-webhook-router
  - plugins/hermes-smd-inbound
  - plugins/hermes-smd-hook-probe
  - plugins/hermes-smd-workspace
  - plugins/hermes-smd-reply
  # initiation MUST register before peer-memory: both resolve the turn's
  # verified sender through SESSION_INBOUND_ORIGIN's claim-once unbound
  # handoff on the live email path, and initiation re-keys the claimed origin
  # under the turn's session id so peer-memory (and any later resolver) finds
  # it via get() instead of starving on an already-claimed entry.
  - plugins/hermes-smd-initiation
  - plugins/hermes-smd-peer-memory
  - plugins/hermes-smd-mcp-result-sink
  - plugins/hermes-smd-jobs
  - plugins/hermes-smd-escalation
  - plugins/hermes-smd-corrections
  - plugins/hermes-smd-connector-health
  - plugins/hermes-smd-usage
  - plugins/hermes-smd-drafting
  - plugins/hermes-smd-establishment
