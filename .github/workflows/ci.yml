name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # The title-model falsifier (tests/test_title_generation_model.py) builds
      # the seat's title request with the REAL Hermes Anthropic adapter, so it
      # needs the fleet's pinned Hermes source. Keep this SHA equal to the
      # hermes_ref the seats run (ss-console operator/customers/*/customer.yaml).
      - name: Check out pinned Hermes (read-only, outside the workspace)
        run: |
          git init -q "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" fetch -q --depth 1 https://github.com/venturecrane/hermes-agent.git 345cd2b057a452236de401d3534b8502a7465e8d
          git -C "$RUNNER_TEMP/hermes-agent" checkout -q FETCH_HEAD
          echo "HERMES_AGENT_SRC=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"

      - name: Pytest
        run: pytest -v
