# ============================================================================
# Overlay env-consumption declaration — what the hermes-smd-overlay code READS
# from the environment. The consumer-side twin of ss-console's
# operator/contracts/env-consumption.yaml (which owns provisioning disposition:
# who PROVIDES/STRIPS/REQUIRES each var). This file owns ONE fact: "the overlay
# reads this var, here, for this."
#
# WHY THIS EXISTS. OP-P0-2: a security pass stripped the account-wide R2 key
# from the agent env, not knowing the voice plugin read it — voice went silent.
# The fact "what reads this var" lived only in someone's head. This file makes
# it explicit and machine-checkable so the next such drift is a failed check,
# not a live incident.
#
# ENFORCEMENT (all derived from THIS file by shared/consumes_conformance.py):
#   1. CI, fail-closed (tests/test_consumes_conformance.py): every env var the
#      overlay reads with a STRING LITERAL (os.environ["X"], os.getenv("X"),
#      secrets.require("X"), get_secret("X")) MUST appear in `vars` below.
#      An undeclared literal read fails the build — the voice-break guard.
#      And every `vars` entry marked `discovery: static` MUST actually be read
#      (no stale declarations).
#   2. Boot-time, WARN-only (umbrella __init__.register): the same
#      reconciliation runs at gateway start and logger.warning()s any
#      undeclared read. It NEVER fails boot — per the Phase A reframe, boot
#      fails only on a liveness check, never on a conformance check (a
#      boot-time grep gate is itself a brick vector). CI is the hard gate.
#
# DISCOVERY CLASSES (the `discovery` field on each var):
#   static   - read with a string literal at the call site; the conformance
#              test finds it by AST and REQUIRES it here.
#   indirect - the var NAME is held in a module constant (e.g. SOCKET_ENV);
#              a real read, but not a literal at the read call, so the AST scan
#              can't tie it to a name. Declared here; exempt from the "must be
#              statically found" stale check.
# Names that are CONSTRUCTED or INDIRECTED at runtime (no single literal name)
# are documented under `dynamic_reads` instead — they cannot be a `vars` key.
#
# Adding a consumer? Add the var here FIRST. If you read a new env var with a
# literal and forget to declare it, CI goes red on the author, not the Captain.

vars:
  SMOKEBALL_REFRESH_TOKEN_FILE:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: >-
      ADR 0054. Override for where the Machine-hosted Smokeball OAuth callback
      writes the firm-delegated refresh token (and the connector reads it).
      Defaults to /opt/data/.smokeball-mcp/refresh_token when unset.
  # ---- Required: the overlay genuinely needs these (no graceful degradation) ----
  SMD_CUSTOMER_SLUG:
    discovery: static
    stage: agent
    requirement: required
    consumed_by: [voice, audit, trust, webhook-router, memory-mirror, workspace, peer-memory]
    note: per-customer identity; read directly and via secrets.require across plugins
  SMD_D1_AUDIT_BINDING:
    discovery: static
    stage: agent
    requirement: required
    consumed_by: [webhook-gate, audit, trust, webhook-router, workspace, overlay-activation-hook, peer-memory]
    note: per-customer audit D1 binding (a path, or the NAME of an env var holding the path)

  SMD_D1_AGENT_STATE_BINDING:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [audit, peer-memory]
    note: per-customer MUTABLE agent-state D1 binding (agent_skills_inventory + peer_preferences); falls back to SMD_D1_AUDIT_BINDING when unset (OP-P1-4 ledger/state split)

  # ---- Indirect: var name held in a module constant, not a literal at the read ----
  SMD_WORKSPACE_BROKER_SOCKET:
    discovery: indirect
    stage: broker
    requirement: required
    consumed_by: [workspace]
    note: "read via os.environ.get(SOCKET_ENV) where SOCKET_ENV = 'SMD_WORKSPACE_BROKER_SOCKET' (shared/workspace_broker.py:10); broker raises if unset"

  SMD_AUDIT_BROKER_SOCKET:
    discovery: indirect
    stage: agent
    requirement: optional
    consumed_by: [audit, trust, webhook-router]
    note: "read via os.environ.get(SOCKET_ENV) where SOCKET_ENV = 'SMD_AUDIT_BROKER_SOCKET' (shared/audit_client.py); set => audit writes route through the broker's append-only audit_append (OP-P1-4); unset => direct D1 write"

  # ---- Optional: plugin no-ops cleanly / a default applies when absent ----
  AGENTMAIL_API_KEY:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [reply]
    note: "AgentMail REST credential (Bearer) for the reply channel's threaded send; used when the inbound sender is on the organization roster (scope.inbound_allow_from). Absent => reply channel disables (no send). Also the secret_env of the agentmail MCP connector (bootstrap/mcp_registry.py)."
  SMD_MCP_STORE_DIR:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate, mcp-result-sink]
    note: "directory for the MCP channel's cross-process result store (shared/mcp_result_store.py); the agent-side result-sink writes, the gate's /mcp long-poll reads. Defaults to /run/smd-mcp (tmpfs) when unset."
  WEBHOOK_SECRET_MCP:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [bootstrap-translate, webhook-gate]
    note: "the mcp channel's HMAC secret. Read as a literal by translate (route materialization, fail-closed/omitted when unset) and via the WEBHOOK_SECRET_<ROUTE> family by the gate's loopback-forward signing. Also the console-proxy bearer for the console-sole door (ADR 0057 amendment): the gate's /mcp/turn and /webhooks/handoff require Bearer WEBHOOK_SECRET_MCP. Gates the webhook-gate launch in bootstrap.sh (AGENTMAIL or MCP secret)."
  # ---- ADR 0023 Wave 1: Machine → control-plane heartbeat (shared/heartbeat.py, in the gate) ----
  MACHINE_HEARTBEAT_KEY:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "shared fleet bearer for POST /api/internal/heartbeat (ADR 0023 #10). Read by the heartbeat emitter in the gate; absent => control-plane POST disabled (admin fleet view stays 'no signal yet'), gate otherwise unaffected. bootstrap.sh STRIPS it from the agent (hermes gateway) env before the exec so a code-executing agent cannot forge heartbeats for another tenant's slug — the gate keeps its inherited copy."
  HEALTHCHECKS_PING_URL:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "per-customer healthchecks.io ping URL staged at provision (ADR 0023 #8). The gate's emitter pings it each tick; grace expiration fires the console /api/webhooks/healthchecks alert. Absent => external dead-man switch disabled, control-plane POST still runs. Stripped from the agent alongside MACHINE_HEARTBEAT_KEY."
  # ---- ADR 0023 Wave 1 (#10): Sentry error monitoring on Machines ----
  SENTRY_DSN:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate, overlay-activation-hook]
    note: "shared smd-operator Sentry project DSN, staged at provision when customer.yaml observability.sentry.enabled (ADR 0023 #11). Both boot processes init from shared/sentry_init.py: the gate (component=gate) and the gateway activation hook (component=gateway), each tagged tenant=<slug>. Absent => Sentry disabled-safe (init is a no-op); errors go unreported but boot is unaffected. PII scrub (send_default_pii=False + before_send/before_breadcrumb) is locked in sentry_init.py and gated by tests/test_sentry_scrub.py. A DSN alone is NOT sufficient to report — see FLY_MACHINE_ID (seat-only gate)."
  FLY_MACHINE_ID:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate, overlay-activation-hook]
    note: "platform-set inside every Fly Machine; the value Sentry already records as server_name. shared/sentry_init.py._is_real_seat() gates ALL reporting on its presence, so a laptop or CI box carrying SENTRY_DSN cannot write to the shared production project. Added 2026-07-27 after an audit found 919 of the project's 6,994 lifetime events (13%) came from one dev laptop tagged environment=prod — including the loudest-looking issues in the project (a 276-event activation failure and unit-test fixtures reporting as 'RuntimeError: kaboom'), which both trained the reader to ignore Sentry mail and competed for a 5,000-event monthly budget. Absent => Sentry disabled-safe. Override with SMD_SENTRY_FORCE=1."
  PYTEST_CURRENT_TEST:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate, overlay-activation-hook]
    note: "pytest-set, never present in production. shared/sentry_init.py._is_real_seat() treats its presence as 'not a seat' so a test run executing ON a Machine still cannot pollute the shared Sentry project. Belt-and-braces alongside FLY_MACHINE_ID."
  SMD_SENTRY_FORCE:
    discovery: indirect
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate, overlay-activation-hook]
    note: "escape hatch for the seat-only gate: '1' forces Sentry init off a Fly Machine, for deliberately reproducing a reporting bug locally. Never set it in a dev loop or CI — that re-opens the laptop-noise defect FLY_MACHINE_ID closed."
  SMD_ENV:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate, overlay-activation-hook]
    note: "Sentry `environment` tag (shared/sentry_init.py); defaults to 'prod' when unset. These are prod Machines, so the default is correct — the override exists for staging seats."
  SENTRY_ENVIRONMENT:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate, overlay-activation-hook]
    note: "fallback source for the Sentry `environment` tag when SMD_ENV is unset (shared/sentry_init.py), matching the conventional sentry-sdk env var name. Absent => 'prod'."
  # ---- ADR 0062 (ss-console #1661): cost breaker + inbound wake guard ----
  SMD_STICKY_STOP_DB_PATH:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [job-worker, webhook-gate]
    note: "test/dev override for the Machine-local sticky_stop state file; defaults to /opt/data/smd/sticky_stop.db (shared/cost_breaker.py). The job worker writes it (record_cost_cents ladder, agent uid); the gate and heartbeat read it read-only (HARD_STOP park + sticky_stop_level field)."
  # ---- ss-console #2003 Q7: the entitlement dial (runtime exposure overrides) ----
  SMD_EXPOSURE_OVERRIDE_DB_PATH:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate, hermes-smd-trust]
    note: "test/dev override for the Machine-local exposure_override state file; defaults to /opt/data/smd/exposure_override.db (shared/exposure_override.py). The gate writes it (POST /entitlement/set, console-proxy bearer); the trust plugin reads it per tool call (effective exposure = authored overlaid by overrides, clamped to the authored exposure_ceiling)."
  SMD_GATE_CAP_DB_PATH:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "test/dev override for the gate-owned inbound wake counter; defaults to /opt/data/smd-gate/wake_counter.db (shared/gate_inbound_cap.py). Root-owned; counts verified routed wakes per UTC day against the authored safety.sticky_stop.inbound_daily_cap (platform default 200)."
  HEARTBEAT_INGEST_URL:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "override for the control-plane heartbeat endpoint; defaults to https://smd.services/api/internal/heartbeat (the apex console — NOT the admin subdomain, which would trigger the /admin rewrite). All Machines report to the one console."
  HEARTBEAT_PERIOD_SECONDS:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "heartbeat tick cadence; defaults to 60 (matches customer.yaml.observability.health.period_seconds). Floored at 5 by the emitter."
  SCHEDULER_CHECK_DEBOUNCE:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "consecutive scheduler self-check crashes before the heartbeat reports scheduler_ok=0 (ss work-liveness fix; report-late beats report-never). Default 3; set 1 on a staging seat to tighten the kill-test window."
  CONNECTOR_CHECK_DEBOUNCE:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "consecutive connector self-check crashes before the heartbeat reports connector_check_ok=0 (ADR 0080; a map has no natural degraded value — the boolean is the reported failure state). Default 3."
  SMD_CONNECTOR_LEDGER_PATH:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [connector-health, webhook-gate]
    note: "path of the per-server connector call-outcome ledger (shared/connector_ledger.py); the agent-side connector-health plugin writes, the gate's heartbeat connector_check reads — the SMD_MCP_STORE_DIR two-process shape. Defaults to /run/smd-connector-health/ledger.json (tmpfs; wiped on restart BY DESIGN — console holds open alerts until post-restart calls rebuild the run)."
  SMD_OVERLAY_REF:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "baked overlay git ref (Dockerfile ENV SMD_OVERLAY_REF=${OVERLAY_REF}); reported as the heartbeat `version` field so the fleet view shows which overlay each Machine runs. Absent => version omitted."
  HERMES_HOME:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [audit, bootstrap-cli]
    note: Hermes home dir; defaults to /opt/data. Also read by the boot-helper CLI.
  HERMES_ACTIVE_PROFILE:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [audit, peer-memory, trust]
    note: active persona slug (Hermes-native); first in the persona-resolution chain. Trust reads it to resolve the active persona's authored exposure (ADR 0056).
  SMD_ACTIVE_PERSONA:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [audit, peer-memory, trust]
    note: persona-slug fallback when HERMES_ACTIVE_PROFILE is unset
  # SMD_TRUST_CEILING retired (ADR 0056): autonomy is no longer a process-env
  # scalar — exposure is authored per persona in customer.yaml and read from the
  # trusted volume. No env override remains.
  SMD_VERTICAL:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [trust]
    note: vertical/pack identifier; selects the non-raisable vertical floor and the provenance gate's law tier
  SMD_COHORT:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [trust]
    note: cohort identifier used in the provenance gate
  CUSTOMER_SLUG:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [voice, shared-d1-env]
    note: legacy fallback for SMD_CUSTOMER_SLUG
  SMD_VOICE_VAULT_DIR:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [voice]
    note: local voice-vault dir (bootstrap Step 2a); preferred so the agent holds NO R2 credential (OP-P0-2)
  SMD_ESCALATION_LEDGER_PATH:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [escalation]
    note: "override for the escalation-ledger twin path read by escalation_state (plugins/hermes-smd-escalation); unset => the Machine default /opt/data/audit/escalation-ledger.jsonl (shared/escalation_ledger.DEFAULT_LEDGER_PATH). Tests set it to a tmp file."
  R2_ENDPOINT_URL:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [voice, audit]
    note: R2 S3 endpoint URL (NOT a credential); voice R2-fallback path + skill_capture
  R2_ACCESS_KEY_ID:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [voice]
    note: account-wide R2 key — voice R2-FALLBACK only; stripped from the agent env in bootstrap (OP-P0-2), so absent in practice
  R2_SECRET_ACCESS_KEY:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [voice]
    note: paired with R2_ACCESS_KEY_ID; voice R2-fallback only; stripped from the agent env
  R2_BUCKET_CONFIG:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [voice]
    note: config-bucket NAME (not a credential); voice R2-fallback path
  R2_SKILL_BODIES_BUCKET:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [audit]
    note: bucket NAME for agent-authored skill-body persistence (ADR 0022 Stream 2)
  R2_SKILL_BODIES_ACCESS_KEY_ID:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [audit]
    note: bucket-SCOPED token for skill-body persistence; capture no-ops when unset
  R2_SKILL_BODIES_SECRET_ACCESS_KEY:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [audit]
    note: paired with R2_SKILL_BODIES_ACCESS_KEY_ID
  SMD_CUSTOMER_YAML_PATH:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-router]
    note: customer.yaml path; defaults to /opt/data/customer.yaml
  SMD_HELD_REPLY_DB_PATH:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [reply]
    note: held-reply queue db (#2070); defaults to /opt/data/held_replies.db
  SMD_SPEC_DIR:
    # indirect: shared/spec_manifest.py reads it through the module constant
    # SPEC_DIR_ENV (exported so translate.py and the trust plugin name the same
    # thing once), so the AST scan cannot tie the read to a literal.
    discovery: indirect
    stage: agent
    requirement: optional
    consumed_by: [trust]
    note: >-
      ss ADR 0083 / ss-console #2084. The ROOT-OWNED directory holding the
      customer's authored per-output-class specs and root's manifest of them,
      installed by the spec_applier before the privilege drop. Read-only to the
      agent uid by construction: read_file is unfenced and does not taint, so an
      agent-WRITABLE spec would be a persistent, untainted, self-authored
      prompt-injection channel surviving restarts. Consumed by the trust
      plugin's read-mark (verifies a spec read against root's manifest) and by
      bootstrap/translate.py (renders the per-profile SKILL.md pointer stamp).
      Unset ⇒ no installed spec tree ⇒ nothing verifiable, which every caller
      reads as fail-closed, never as a pass.
  SMD_WEBHOOK_SIGNING_SECRET:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-router]
    note: HMAC secret verifying inbound webhooks; when unset the router disables routing (fail-closed) rather than trusting unsigned events
  CUSTOMER_DB:
    discovery: indirect
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "audit D1 path fallback when SMD_D1_AUDIT_BINDING does not resolve; read via os.environ.get(fallback_env) in webhook_gate._db_path_from_binding (#1355 export kinds generalized the resolver)"
  OPERATOR_RUNTIME_READ_KEY:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: per-customer ADR 0043 read-seam auth key (HMAC(master, slug)); the seam is inert when unset
  WEBHOOK_GATE_LOG_LEVEL:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: log level for the webhook gate; defaults to INFO
  WEBHOOK_GATE_PORT:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: webhook gate listen port
  WEBHOOK_GATEWAY_HOST:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: upstream Hermes gateway host; defaults to 127.0.0.1
  WEBHOOK_GATEWAY_PORT:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: upstream Hermes gateway port; defaults to 8644
  # ---- ADR 0078 email-channel-seam D1: the msgraph delta poller (shared/msgraph_poller.py, in the gate) ----
  WEBHOOK_SECRET_MSGRAPH:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [bootstrap-translate, webhook-gate]
    note: "the msgraph inbound route's HMAC secret. Read as a literal by translate (materializes the loopback `msgraph` route, fail-closed/omitted when unset) and by the delta poller to sign its loopback POST so Hermes' webhook adapter re-verifies. The MSGRAPH_TENANT_ID/CLIENT_ID/CLIENT_SECRET/MAILBOX creds are read via shared.secrets.get_secret (the declared dynamic seam), not as static literals."
  MSGRAPH_POLL_SECONDS:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "poller cadence fallback (seconds) when customer.yaml connectors.Email.poll_seconds is absent; defaults to 45. The authored per-seat value wins."
  SMD_MSGRAPH_STATE_PATH:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "override for the poller's durable delta-cursor + seen-id ledger file; defaults to $HERMES_HOME/msgraph/delta-state.json."
  WEBHOOK_SMOKEBALL_CLIENT_ID:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [webhook-gate]
    note: "our Smokeball API ClientId — fed into the Smokeball webhook HMAC ({Timestamp}|{RequestId}|{ClientId}); it is NOT delivered by Smokeball. Required when the smokeball webhook route is enabled; the route fail-closes (401) when unset. The route HMAC secret rides the WEBHOOK_SECRET_<ROUTE> family (WEBHOOK_SECRET_SMOKEBALL)."
  SKILLS_DIR:
    discovery: static
    stage: boot-helper
    requirement: optional
    consumed_by: [bootstrap-translate]
    note: skills-dir override during customer.yaml translation
  SMD_D1_OBSERVATIONS_BINDING:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [memory-mirror]
    note: Honcho observations mirror binding; inert in Phase 1 (ADR 0016 revised)
  HONCHO_BASE_URL:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [memory-mirror]
    note: local Honcho sidecar base URL; inert in Phase 1
  HONCHO_API_KEY:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [memory-mirror]
    note: Honcho API key; inert in Phase 1

  # ---- B1 durable task-execution substrate (ADR 0051; consumed_by: jobs) ----
  HERMES_MODEL:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [jobs]
    note: Hermes-native active model; start_background_job records it on the job row at intake (worker resolves/validates authoritatively at claim time)
  HERMES_PERSONA_SLUG:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [jobs]
    note: advisory persona slug for the job row at intake; worker resolves the authoritative persona
  SMD_JOB_DEFAULT_BUDGET_CENTS:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [jobs]
    note: authored default per-job budget (materialized from customer.yaml); conservative fallback applies when unset
  HERMES_JOB_ID:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [jobs]
    note: set by the worker around a background segment; read by job_record_sideeffect to scope the idempotency journal. Unset outside a background job (no-op proceed)
  HERMES_JOB_LEASE_EPOCH:
    discovery: static
    stage: agent
    requirement: optional
    consumed_by: [jobs]
    note: set by the worker around a background segment; the lease epoch idempotency writes are fenced on. Unset outside a background job

# Names CONSTRUCTED or INDIRECTED at runtime — no single literal name, so they
# cannot be a `vars` key. Documented here so a NEW such site is a reviewable
# diff, and so the conformance scan can legitimately ignore the indirection
# plumbing (it reads only names already declared above, or per-route names).
dynamic_reads:
  - site: webhook_gate.py::_route_secret
    family: WEBHOOK_SECRET_<ROUTE>
    note: per-route inbound-webhook HMAC secret; the suffix is the adapter slug, constructed at runtime
  - site: shared/secrets.py::get_secret / require
    note: the single env accessor; reads the literal names its callers pass (every such literal is declared in `vars`)
  - sites: [shared/d1_client.py, webhook_gate.py::_audit_db_path, hooks/smd-overlay-activation/handler.py]
    note: binding indirection — reads the env var NAMED BY the value of SMD_D1_AUDIT_BINDING when that value is a var name rather than a path
